<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 500px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>원클릭 관리자 화면</h1>
        <p>수정사항을 입력하고 '수정 요청' 버튼을 누르세요.</p>
        <textarea id="update-request" placeholder="수정사항을 여기에 입력하세요..."></textarea>
        <button onclick="sendUpdateRequest()">수정 요청</button>
    </div>

    <script>
        function sendUpdateRequest() {
            const requestText = document.getElementById('update-request').value;
            if (!requestText) {
                alert('수정사항을 입력해주세요.');
                return;
            }

            fetch('/api/auto-deploy', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    changes: requestText
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('수정 요청이 성공적으로 전송되었습니다.');
                } else {
                    alert('수정 요청 전송에 실패했습니다: ' + data.message);
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('오류가 발생했습니다. 자세한 내용은 콘솔을 확인하세요.');
            });
        }
    </script>
</body>
</html>
